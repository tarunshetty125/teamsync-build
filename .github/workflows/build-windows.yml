name: Build Windows App

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Node
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # Rust
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # Cache Rust build artifacts for faster CI
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      # MSVC build tools
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # Install deps
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # Rebuild native modules for Electron ABI
      - name: Rebuild native modules
        run: |
          npx electron-rebuild -f

      # Build frontend
      - name: Build frontend
        run: npm run build

      # Build electron
      - name: Build electron
        run: npm run build:electron

      # Build Rust native module
      - name: Build native module
        run: |
          echo Building Windows native module...
          npm run build:native

      # Prepare bundled Python runtime for OCR
      - name: Prepare Python OCR Runtime
        run: |
          cd python-runtime
          powershell -ExecutionPolicy Bypass -File prepare-win.ps1

      # Build Windows app — let package.json targets (nsis + portable) drive output
      - name: Build Windows App
        run: |
          npx electron-builder --win --publish=never

      # Upload to GitHub Release draft (no storage cap, unlike artifacts)
      - name: Upload to dev release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="dev-windows-latest"
          # Delete existing release if present, then recreate
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            --title "Windows Dev Build ($(date -u +%Y-%m-%d))" \
            --notes "Automated dev build from commit ${{ github.sha }}" \
            --draft \
            --prerelease \
            release/*.exe release/*.blockmap release/*.yml
