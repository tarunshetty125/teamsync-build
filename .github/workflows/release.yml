name: Release Desktop

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  RELEASE_REPO: tarunshetty125/TeamSync

jobs:
  metadata:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      channel: ${{ steps.meta.outputs.channel }}
      release_type: ${{ steps.meta.outputs.release_type }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      windows_manifest: ${{ steps.meta.outputs.windows_manifest }}
      mac_manifest: ${{ steps.meta.outputs.mac_manifest }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate tag and channel
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          package_version="$(node -p "require('./package.json').version")"

          if [[ "${tag}" == "${version}" ]]; then
            echo "Release tags must be v-prefixed, for example v2.5.1" >&2
            exit 1
          fi

          if [[ "${version}" != "${package_version}" ]]; then
            echo "Tag version (${version}) must match package.json version (${package_version})" >&2
            exit 1
          fi

          if [[ "${version}" =~ -beta\. ]]; then
            channel="beta"
            release_type="prerelease"
            prerelease="true"
            windows_manifest="beta.yml"
            mac_manifest="beta-mac.yml"
          elif [[ "${version}" == *-* ]]; then
            echo "Unsupported prerelease channel in ${version}; only beta is currently supported" >&2
            exit 1
          else
            channel="latest"
            release_type="release"
            prerelease="false"
            windows_manifest="latest.yml"
            mac_manifest="latest-mac.yml"
          fi

          {
            echo "tag=${tag}"
            echo "version=${version}"
            echo "channel=${channel}"
            echo "release_type=${release_type}"
            echo "prerelease=${prerelease}"
            echo "windows_manifest=${windows_manifest}"
            echo "mac_manifest=${mac_manifest}"
          } >> "${GITHUB_OUTPUT}"

  # ── Create the GitHub Release shell (empty, both build jobs upload into it) ──
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: metadata
    steps:
      - name: Create release (if not exists)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ needs.metadata.outputs.tag }}"
          version="${{ needs.metadata.outputs.version }}"

          if gh release view "${tag}" --repo "${RELEASE_REPO}" > /dev/null 2>&1; then
            echo "Release ${tag} already exists in ${RELEASE_REPO}"
          else
            release_args=(
              release create "${tag}"
              --repo "${RELEASE_REPO}"
              --title "Quietly ${version}"
              --notes "## Quietly ${version}\n\n- Channel: ${{ needs.metadata.outputs.channel }}\n- Source: ${{ github.repository }}@${{ github.sha }}"
            )
            if [[ "${{ needs.metadata.outputs.prerelease }}" == "true" ]]; then
              release_args+=(--prerelease)
            fi
            gh "${release_args[@]}"
          fi

  build-mac:
    name: Build macOS
    runs-on: macos-latest
    needs:
      - metadata
      - create-release
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Remove nested sharp (prevents electron-rebuild failure)
        run: rm -rf node_modules/@xenova/transformers/node_modules/sharp

      - name: Rebuild native modules
        run: npx electron-rebuild -f

      - name: Build frontend
        run: npm run build

      - name: Build Electron main
        run: npm run build:electron

      - name: Build native module
        run: npm run build:native
        env:
          TEAMSYNC_BUILD_ALL_MAC_ARCHES: "1"

      - name: Prepare Python OCR runtime arm64
        run: |
          chmod +x python-runtime/prepare-mac.sh
          cd python-runtime
          bash prepare-mac.sh arm64

      - name: Prepare Python OCR runtime x64
        run: |
          cd python-runtime
          bash prepare-mac.sh x64

      - name: Create release builder config
        run: |
          node scripts/create-release-builder-config.js \
            --channel "${{ needs.metadata.outputs.channel }}" \
            --release-type "${{ needs.metadata.outputs.release_type }}" \
            --out "${RUNNER_TEMP}/electron-builder.release.json"

      - name: Build macOS artifacts
        run: |
          npx electron-builder \
            --config "${RUNNER_TEMP}/electron-builder.release.json" \
            --mac dmg zip \
            --x64 \
            --arm64 \
            --publish=never

      - name: Publish macOS assets to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ needs.metadata.outputs.tag }}"
          echo "Uploading macOS assets to ${RELEASE_REPO} @ ${tag}"
          gh release upload "${tag}" \
            release/*.dmg \
            release/*.zip \
            release/*.blockmap \
            release/${{ needs.metadata.outputs.mac_manifest }} \
            --repo "${RELEASE_REPO}" --clobber

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs:
      - metadata
      - create-release
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Remove nested sharp (prevents electron-rebuild failure)
        run: Remove-Item -Recurse -Force node_modules/@xenova/transformers/node_modules/sharp -ErrorAction SilentlyContinue

      - name: Rebuild native modules
        run: npx electron-rebuild -f

      - name: Build frontend
        run: npm run build

      - name: Build Electron main
        run: npm run build:electron

      - name: Build native module
        run: npm run build:native

      - name: Prepare Python OCR runtime
        run: |
          cd python-runtime
          powershell -ExecutionPolicy Bypass -File prepare-win.ps1

      - name: Create release builder config
        run: >
          node scripts/create-release-builder-config.js
          --channel "${{ needs.metadata.outputs.channel }}"
          --release-type "${{ needs.metadata.outputs.release_type }}"
          --out "$env:RUNNER_TEMP\electron-builder.release.json"

      - name: Build Windows artifacts
        run: >
          npx electron-builder
          --config "$env:RUNNER_TEMP\electron-builder.release.json"
          --win
          --publish=never

      - name: Publish Windows assets to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ needs.metadata.outputs.tag }}"
          echo "Uploading Windows assets to ${RELEASE_REPO} @ ${tag}"
          gh release upload "${tag}" \
            release/*.exe \
            release/*.blockmap \
            release/${{ needs.metadata.outputs.windows_manifest }} \
            --repo "${RELEASE_REPO}" --clobber
