<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TeamSync · License Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-primary: #050507;
      --bg-card: rgba(255,255,255,0.035);
      --bg-card-hover: rgba(255,255,255,0.055);
      --bg-input: rgba(255,255,255,0.06);
      --bg-elevated: rgba(255,255,255,0.08);
      --border: rgba(255,255,255,0.07);
      --border-strong: rgba(255,255,255,0.12);
      --text-primary: #f0f0f5;
      --text-secondary: rgba(240,240,245,0.55);
      --text-tertiary: rgba(240,240,245,0.35);
      --accent: #6C5CE7;
      --accent-glow: rgba(108,92,231,0.15);
      --green: #00D68F;
      --green-bg: rgba(0,214,143,0.1);
      --amber: #FFAA00;
      --amber-bg: rgba(255,170,0,0.1);
      --red: #FF6B6B;
      --red-bg: rgba(255,107,107,0.1);
      --blue: #4ECDC4;
      --blue-bg: rgba(78,205,196,0.1);
      --radius: 16px;
      --radius-sm: 10px;
      --radius-pill: 100px;
      --ease: cubic-bezier(0.32, 0.72, 0, 1);
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Ambient background ────────────────────────── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 600px 400px at 15% 10%, rgba(108,92,231,0.08), transparent),
        radial-gradient(ellipse 500px 500px at 85% 80%, rgba(78,205,196,0.05), transparent);
      pointer-events: none;
      z-index: 0;
    }

    /* ── Noise overlay ─────────────────────────────── */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      opacity: 0.025;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 1;
    }

    .app { position: relative; z-index: 2; }

    /* ── Header ────────────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 32px;
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(40px) saturate(180%);
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(5,5,7,0.7);
    }
    .header-left { display: flex; align-items: center; gap: 14px; }
    .logo {
      width: 34px; height: 34px;
      background: linear-gradient(135deg, var(--accent), #a78bfa);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 16px; color: white;
      box-shadow: 0 4px 20px rgba(108,92,231,0.25);
    }
    .header-title { font-size: 16px; font-weight: 700; letter-spacing: -0.02em; }
    .header-subtitle { font-size: 12px; color: var(--text-tertiary); margin-top: 1px; }
    .header-right { display: flex; align-items: center; gap: 10px; }

    /* ── Auth overlay ──────────────────────────────── */
    .auth-overlay {
      position: fixed; inset: 0; z-index: 999;
      display: flex; align-items: center; justify-content: center;
      background: var(--bg-primary);
    }
    .auth-overlay.hidden { display: none; }
    .auth-card {
      width: 380px;
      padding: 40px;
      border-radius: 24px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      backdrop-filter: blur(40px);
      text-align: center;
    }
    .auth-card h2 { font-size: 22px; font-weight: 800; margin-bottom: 6px; letter-spacing: -0.03em; }
    .auth-card p { font-size: 13px; color: var(--text-secondary); margin-bottom: 28px; }
    .auth-card .auth-error { color: var(--red); font-size: 12px; margin-top: 12px; display: none; }

    /* ── Container ─────────────────────────────────── */
    .container { max-width: 1200px; margin: 0 auto; padding: 32px 32px 80px; }

    /* ── Stats grid ────────────────────────────────── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 14px;
      margin-bottom: 32px;
    }
    .stat-card {
      padding: 22px 24px;
      border-radius: var(--radius);
      background: var(--bg-card);
      border: 1px solid var(--border);
      transition: all 0.5s var(--ease);
    }
    .stat-card:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-strong);
      transform: translateY(-2px);
    }
    .stat-label {
      font-size: 11px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--text-tertiary);
      margin-bottom: 8px;
    }
    .stat-value {
      font-size: 32px; font-weight: 800;
      letter-spacing: -0.04em;
      background: linear-gradient(135deg, var(--text-primary), var(--text-secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .stat-value.green { background: linear-gradient(135deg, #00D68F, #4ECDC4); -webkit-background-clip: text; }
    .stat-value.accent { background: linear-gradient(135deg, #6C5CE7, #a78bfa); -webkit-background-clip: text; }
    .stat-value.amber { background: linear-gradient(135deg, #FFAA00, #FFD93D); -webkit-background-clip: text; }

    /* ── Section header ────────────────────────────── */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }
    .section-title {
      font-size: 18px; font-weight: 800;
      letter-spacing: -0.03em;
    }

    /* ── Buttons ───────────────────────────────────── */
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 20px;
      font-size: 13px; font-weight: 600;
      border: none; border-radius: var(--radius-pill);
      cursor: pointer;
      transition: all 0.4s var(--ease);
      font-family: inherit;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #7c6cf0);
      color: white;
      box-shadow: 0 4px 20px rgba(108,92,231,0.25), inset 0 1px 0 rgba(255,255,255,0.15);
    }
    .btn-primary:hover {
      box-shadow: 0 6px 30px rgba(108,92,231,0.35), inset 0 1px 0 rgba(255,255,255,0.2);
      transform: translateY(-1px);
    }
    .btn-ghost {
      background: var(--bg-input);
      color: var(--text-secondary);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { background: var(--bg-elevated); color: var(--text-primary); }
    .btn-danger {
      background: var(--red-bg);
      color: var(--red);
      border: 1px solid rgba(255,107,107,0.15);
    }
    .btn-danger:hover { background: rgba(255,107,107,0.18); }
    .btn-sm { padding: 6px 14px; font-size: 12px; }

    /* ── Table ─────────────────────────────────────── */
    .table-wrap {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    table { width: 100%; border-collapse: collapse; }
    thead th {
      font-size: 11px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--text-tertiary);
      text-align: left;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      background: rgba(255,255,255,0.015);
    }
    tbody td {
      padding: 14px 18px;
      font-size: 13px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    tbody tr { transition: background 0.3s var(--ease); }
    tbody tr:hover { background: var(--bg-card-hover); }
    tbody tr:last-child td { border-bottom: none; }

    /* ── Badges ────────────────────────────────────── */
    .badge {
      display: inline-flex; align-items: center;
      padding: 4px 10px;
      font-size: 11px; font-weight: 700;
      border-radius: var(--radius-pill);
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }
    .badge-free { background: var(--bg-elevated); color: var(--text-secondary); }
    .badge-pro { background: var(--accent-glow); color: #a78bfa; border: 1px solid rgba(108,92,231,0.15); }
    .badge-pro_plus { background: linear-gradient(135deg, rgba(255,170,0,0.12), rgba(255,107,107,0.08)); color: var(--amber); border: 1px solid rgba(255,170,0,0.15); }
    .badge-team { background: var(--blue-bg); color: var(--blue); border: 1px solid rgba(78,205,196,0.15); }
    .badge-active { background: var(--green-bg); color: var(--green); }
    .badge-revoked, .badge-expired, .badge-disabled { background: var(--red-bg); color: var(--red); }

    /* ── Mono / Key ────────────────────────────────── */
    .mono {
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 12px;
      color: var(--text-secondary);
      letter-spacing: 0.02em;
    }

    /* ── Modal ─────────────────────────────────────── */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 500;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(12px);
      display: flex; align-items: center; justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s var(--ease);
    }
    .modal-overlay.open { opacity: 1; pointer-events: all; }
    .modal {
      width: 440px; max-height: 90vh; overflow-y: auto;
      padding: 32px;
      border-radius: 20px;
      background: #0c0c0f;
      border: 1px solid var(--border-strong);
      transform: scale(0.95) translateY(10px);
      transition: transform 0.4s var(--ease);
    }
    .modal-overlay.open .modal { transform: scale(1) translateY(0); }
    .modal h3 {
      font-size: 18px; font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 20px;
    }
    .form-group { margin-bottom: 16px; }
    .form-label {
      display: block;
      font-size: 12px; font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .form-input, .form-select {
      width: 100%;
      padding: 11px 14px;
      font-size: 14px;
      font-family: inherit;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      outline: none;
      transition: all 0.3s var(--ease);
    }
    .form-input:focus, .form-select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    .form-select { appearance: none; cursor: pointer; }
    .form-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px; }

    /* ── Key reveal ────────────────────────────────── */
    .key-reveal {
      padding: 20px;
      border-radius: var(--radius-sm);
      background: rgba(0,214,143,0.06);
      border: 1px solid rgba(0,214,143,0.15);
      margin-top: 16px;
    }
    .key-reveal-label { font-size: 11px; color: var(--green); font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; }
    .key-reveal-value {
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 18px; font-weight: 700;
      color: var(--text-primary);
      letter-spacing: 0.06em;
      word-break: break-all;
      user-select: all;
    }
    .key-reveal-warning { font-size: 11px; color: var(--amber); margin-top: 10px; }

    /* ── Empty state ───────────────────────────────── */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-tertiary);
    }
    .empty-state svg { margin: 0 auto 16px; opacity: 0.3; }
    .empty-state p { font-size: 14px; }

    /* ── Responsive ────────────────────────────────── */
    @media (max-width: 768px) {
      .container { padding: 20px 16px 60px; }
      .header { padding: 16px; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
      .table-wrap { overflow-x: auto; }
      table { min-width: 700px; }
      .modal { width: calc(100% - 32px); padding: 24px; }
    }

    /* ── Animations ────────────────────────────────── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-in { animation: fadeUp 0.5s var(--ease) both; }
    .delay-1 { animation-delay: 0.05s; }
    .delay-2 { animation-delay: 0.1s; }
    .delay-3 { animation-delay: 0.15s; }
    .delay-4 { animation-delay: 0.2s; }
    .delay-5 { animation-delay: 0.25s; }

    /* ── Toast ─────────────────────────────────────── */
    .toast {
      position: fixed; bottom: 24px; right: 24px;
      padding: 14px 22px;
      border-radius: var(--radius-sm);
      font-size: 13px; font-weight: 600;
      z-index: 600;
      transform: translateY(20px);
      opacity: 0;
      transition: all 0.4s var(--ease);
      pointer-events: none;
    }
    .toast.show { transform: translateY(0); opacity: 1; pointer-events: auto; }
    .toast.success { background: var(--green-bg); color: var(--green); border: 1px solid rgba(0,214,143,0.2); }
    .toast.error { background: var(--red-bg); color: var(--red); border: 1px solid rgba(255,107,107,0.2); }

    /* ── Scrollbar ─────────────────────────────────── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.15); }
  </style>
</head>
<body>
  <!-- Auth Overlay -->
  <div class="auth-overlay" id="authOverlay">
    <div class="auth-card animate-in">
      <div class="logo" style="margin: 0 auto 20px; width: 48px; height: 48px; font-size: 22px; border-radius: 14px;">T</div>
      <h2>Admin Console</h2>
      <p>Enter your admin secret to access the license dashboard.</p>
      <div class="form-group">
        <input type="password" class="form-input" id="authInput" placeholder="Admin secret" autocomplete="off"
               style="text-align: center; font-size: 15px; letter-spacing: 0.04em;">
      </div>
      <button class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 4px;" onclick="authenticate()">
        Authenticate
      </button>
      <div class="auth-error" id="authError">Invalid admin secret</div>
    </div>
  </div>

  <div class="app" id="app" style="display: none;">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <div class="logo">T</div>
        <div>
          <div class="header-title">License Admin</div>
          <div class="header-subtitle">TeamSync Management Console</div>
        </div>
      </div>
      <div class="header-right">
        <button class="btn btn-ghost btn-sm" onclick="loadData()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
          Refresh
        </button>
        <button class="btn btn-ghost btn-sm" onclick="logout()" title="Sign out">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </header>

    <div class="container">
      <!-- Stats -->
      <div class="stats-grid" id="statsGrid">
        <div class="stat-card animate-in delay-1"><div class="stat-label">Total Licenses</div><div class="stat-value" id="statTotal">—</div></div>
        <div class="stat-card animate-in delay-2"><div class="stat-label">Active</div><div class="stat-value green" id="statActive">—</div></div>
        <div class="stat-card animate-in delay-3"><div class="stat-label">Active Devices</div><div class="stat-value accent" id="statDevices">—</div></div>
        <div class="stat-card animate-in delay-4"><div class="stat-label">Trials</div><div class="stat-value amber" id="statTrials">—</div></div>
      </div>

      <!-- Plan breakdown mini badges -->
      <div id="planBreakdown" style="display: flex; gap: 8px; margin-bottom: 28px; flex-wrap: wrap;"></div>

      <!-- Licenses Table -->
      <div class="section-header animate-in delay-5">
        <div class="section-title">Licenses</div>
        <button class="btn btn-primary" onclick="openCreateModal()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          New License
        </button>
      </div>

      <div class="table-wrap animate-in delay-5" id="tableWrap">
        <table>
          <thead>
            <tr>
              <th>License ID</th>
              <th>Plan</th>
              <th>Status</th>
              <th>Devices</th>
              <th>Created</th>
              <th style="text-align: right;">Actions</th>
            </tr>
          </thead>
          <tbody id="licenseTableBody">
            <tr><td colspan="6" class="empty-state"><p>Loading...</p></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Create / Edit Modal -->
  <div class="modal-overlay" id="modalOverlay" onclick="event.target===this&&closeModal()">
    <div class="modal">
      <h3 id="modalTitle">New License</h3>
      <input type="hidden" id="editLicenseId">

      <div class="form-group">
        <label class="form-label">Plan</label>
        <select class="form-select" id="formPlan">
          <option value="free">Free</option>
          <option value="pro" selected>Pro — $12/mo</option>
          <option value="pro_plus">Pro Plus — $24/mo</option>
          <option value="team">Team</option>
        </select>
      </div>

      <div class="form-group" id="statusGroup" style="display:none;">
        <label class="form-label">Status</label>
        <select class="form-select" id="formStatus">
          <option value="active">Active</option>
          <option value="expired">Expired</option>
          <option value="revoked">Revoked</option>
          <option value="disabled">Disabled</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Device Limit</label>
        <input type="number" class="form-input" id="formDeviceLimit" value="3" min="1" max="100">
      </div>

      <div class="form-group" id="userIdGroup">
        <label class="form-label">User ID (optional)</label>
        <input type="text" class="form-input" id="formUserId" placeholder="auto-generated if empty">
      </div>

      <div id="keyRevealArea"></div>

      <div class="form-actions">
        <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" id="modalSubmitBtn" onclick="submitModal()">Create License</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script>
    let API_BASE = '';
    let AUTH_TOKEN = '';

    // ── Auth ─────────────────────────────────────────
    function authenticate() {
      const secret = document.getElementById('authInput').value.trim();
      if (!secret) return;
      AUTH_TOKEN = secret;
      // Test with stats call
      apiFetch('/admin/stats')
        .then(() => {
          document.getElementById('authOverlay').classList.add('hidden');
          document.getElementById('app').style.display = '';
          sessionStorage.setItem('admin_token', secret);
          loadData();
        })
        .catch(() => {
          const err = document.getElementById('authError');
          err.style.display = 'block';
          setTimeout(() => err.style.display = 'none', 3000);
        });
    }

    function logout() {
      sessionStorage.removeItem('admin_token');
      AUTH_TOKEN = '';
      document.getElementById('authOverlay').classList.remove('hidden');
      document.getElementById('app').style.display = 'none';
      document.getElementById('authInput').value = '';
    }

    // ── API Helper ───────────────────────────────────
    async function apiFetch(path, options = {}) {
      const res = await fetch(API_BASE + path, {
        ...options,
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${AUTH_TOKEN}`,
          ...(options.headers || {}),
        },
      });
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        throw new Error(data.error || `HTTP ${res.status}`);
      }
      return res.json();
    }

    // ── Load Data ────────────────────────────────────
    async function loadData() {
      try {
        const [statsRes, licensesRes] = await Promise.all([
          apiFetch('/admin/stats'),
          apiFetch('/admin/licenses'),
        ]);
        renderStats(statsRes.stats);
        renderLicenses(licensesRes.licenses);
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    function renderStats(stats) {
      document.getElementById('statTotal').textContent = stats.totalLicenses;
      document.getElementById('statActive').textContent = stats.activeLicenses;
      document.getElementById('statDevices').textContent = stats.activeDevices;
      document.getElementById('statTrials').textContent = stats.totalTrials;

      const breakdown = document.getElementById('planBreakdown');
      breakdown.innerHTML = Object.entries(stats.planBreakdown || {}).map(([plan, count]) =>
        `<span class="badge badge-${plan}">${plan.replace('_',' ')} · ${count}</span>`
      ).join('');
    }

    function renderLicenses(licenses) {
      const tbody = document.getElementById('licenseTableBody');
      if (!licenses.length) {
        tbody.innerHTML = `<tr><td colspan="6" class="empty-state"><p>No licenses yet. Click "New License" to create one.</p></td></tr>`;
        return;
      }
      tbody.innerHTML = licenses.map(lic => `
        <tr>
          <td><span class="mono">${lic.licenseId}</span></td>
          <td><span class="badge badge-${lic.plan}">${lic.plan.replace('_',' ')}</span></td>
          <td><span class="badge badge-${lic.status}">${lic.status}</span></td>
          <td>${lic.activeDevices || 0} / ${lic.deviceLimit || '—'}</td>
          <td style="color: var(--text-secondary)">${formatDate(lic.createdAt)}</td>
          <td style="text-align: right;">
            <button class="btn btn-ghost btn-sm" onclick="openEditModal('${lic.licenseId}', '${lic.plan}', '${lic.status}', ${lic.deviceLimit || 3})" title="Edit">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            </button>
            <button class="btn btn-danger btn-sm" onclick="deleteLicense('${lic.licenseId}')" title="Delete" style="margin-left: 4px;">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
            </button>
          </td>
        </tr>
      `).join('');
    }

    // ── Create / Edit Modal ──────────────────────────
    function openCreateModal() {
      document.getElementById('modalTitle').textContent = 'New License';
      document.getElementById('editLicenseId').value = '';
      document.getElementById('formPlan').value = 'pro';
      document.getElementById('formStatus').value = 'active';
      document.getElementById('formDeviceLimit').value = '3';
      document.getElementById('formUserId').value = '';
      document.getElementById('statusGroup').style.display = 'none';
      document.getElementById('userIdGroup').style.display = '';
      document.getElementById('keyRevealArea').innerHTML = '';
      document.getElementById('modalSubmitBtn').textContent = 'Create License';
      document.getElementById('modalOverlay').classList.add('open');
    }

    function openEditModal(licenseId, plan, status, deviceLimit) {
      document.getElementById('modalTitle').textContent = 'Edit License';
      document.getElementById('editLicenseId').value = licenseId;
      document.getElementById('formPlan').value = plan;
      document.getElementById('formStatus').value = status;
      document.getElementById('formDeviceLimit').value = deviceLimit;
      document.getElementById('statusGroup').style.display = '';
      document.getElementById('userIdGroup').style.display = 'none';
      document.getElementById('keyRevealArea').innerHTML = '';
      document.getElementById('modalSubmitBtn').textContent = 'Save Changes';
      document.getElementById('modalOverlay').classList.add('open');
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('open');
    }

    async function submitModal() {
      const licenseId = document.getElementById('editLicenseId').value;
      const plan = document.getElementById('formPlan').value;
      const deviceLimit = parseInt(document.getElementById('formDeviceLimit').value) || 3;
      const btn = document.getElementById('modalSubmitBtn');
      btn.disabled = true;
      btn.textContent = 'Processing...';

      try {
        if (licenseId) {
          // Update
          const status = document.getElementById('formStatus').value;
          await apiFetch(`/admin/licenses/${licenseId}`, {
            method: 'PATCH',
            body: JSON.stringify({ plan, status, deviceLimit }),
          });
          showToast('License updated', 'success');
          closeModal();
        } else {
          // Create
          const userId = document.getElementById('formUserId').value.trim() || undefined;
          const res = await apiFetch('/admin/licenses', {
            method: 'POST',
            body: JSON.stringify({ plan, deviceLimit, userId }),
          });
          // Show the raw key
          document.getElementById('keyRevealArea').innerHTML = `
            <div class="key-reveal">
              <div class="key-reveal-label">🔑 License Key (copy now!)</div>
              <div class="key-reveal-value" onclick="navigator.clipboard.writeText(this.textContent);showToast('Copied!','success')">${res.license.rawKey}</div>
              <div class="key-reveal-warning">⚠️ This key is shown only once. Copy it now and share with the user.</div>
            </div>
          `;
          document.getElementById('modalSubmitBtn').style.display = 'none';
          showToast('License created', 'success');
        }
        loadData();
      } catch (err) {
        showToast(err.message, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = licenseId ? 'Save Changes' : 'Create License';
      }
    }

    // ── Delete ───────────────────────────────────────
    async function deleteLicense(licenseId) {
      if (!confirm(`Delete license ${licenseId}? This cannot be undone.`)) return;
      try {
        await apiFetch(`/admin/licenses/${licenseId}`, { method: 'DELETE' });
        showToast('License deleted', 'success');
        loadData();
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    // ── Toast ────────────────────────────────────────
    function showToast(msg, type = 'success') {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.className = `toast ${type} show`;
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    // ── Helpers ──────────────────────────────────────
    function formatDate(d) {
      if (!d) return '—';
      const date = new Date(d);
      return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    // ── Init ─────────────────────────────────────────
    document.addEventListener('DOMContentLoaded', () => {
      // Enter key on auth input
      document.getElementById('authInput').addEventListener('keydown', e => {
        if (e.key === 'Enter') authenticate();
      });

      // Check saved token
      const saved = sessionStorage.getItem('admin_token');
      if (saved) {
        AUTH_TOKEN = saved;
        apiFetch('/admin/stats')
          .then(() => {
            document.getElementById('authOverlay').classList.add('hidden');
            document.getElementById('app').style.display = '';
            loadData();
          })
          .catch(() => sessionStorage.removeItem('admin_token'));
      }
    });
  </script>
</body>
</html>
